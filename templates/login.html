<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeking Bias — Access Terminal</title>
  <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>

<!-- Animated background canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Scanlines overlay -->
<div class="scanlines"></div>

<!-- Vignette -->
<div class="vignette"></div>

<!-- Page -->
<div class="page">
  <div class="login-panel" style="position:relative">

    <!-- Corner decorations -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Brand -->
    <div class="panel-brand">
      <div class="brand-mark">B</div>
      <div class="brand-text">
        <span class="brand-name">SEEKING BIAS</span>
        <span class="brand-sub">Quantitative Fund Management</span>
      </div>
    </div>

    <!-- Title -->
    <div class="access-label">Secure Access</div>
    <div class="panel-title">Sign In</div>

    <!-- Form -->
    <form method="POST" action="/login">
      <div class="field">
        <label class="field-label" for="username">Operator ID</label>
        <input class="field-input" type="text" id="username" name="username"
          placeholder="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field-label" for="password">Access Key</label>
        <input class="field-input" type="password" id="password" name="password"
          placeholder="••••••••••••" autocomplete="current-password" required>
      </div>
      <div class="field">
        <button class="login-btn" type="submit">Authenticate →</button>
      </div>
    </form>

    {% if error_message %}
    <div class="error-block">
      <span class="error-icon">⚠</span>
      <span class="error-text">{{ error_message }}</span>
    </div>
    {% endif %}

    <!-- Footer -->
    <div class="panel-footer">
      <div class="footer-status">
        <div class="status-dot"></div>
        <span class="footer-status-text">Systems Operational</span>
      </div>
      <span class="footer-time" id="loginClock">--.--.----  --:--:--</span>
    </div>

  </div>
</div>

<!-- Watermark -->
<div class="watermark">Seeking Bias Fund Management Platform · Restricted Access</div>

<script src="../static/js/login.js"></script>
</body>
</html>
