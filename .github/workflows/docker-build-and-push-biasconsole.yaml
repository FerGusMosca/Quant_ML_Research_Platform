name: Build and Push zz-bias-console

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure output exists (for Docker build context)
        run: mkdir -p ./output && echo "init" > ./output/.keep

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./commands/mgmt_console/Dockerfile
          push: true
          tags: alienzimzum/zz-bias-console:latest
