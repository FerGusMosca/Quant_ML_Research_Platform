version: "3.9"

services:
  rag_metadata:
    build:
      context: ../Quant_ML_Research_Platform
      dockerfile: commands/rag_corpus_metadata/Dockerfile
    container_name: rag_metadata
    volumes:
      - /root/zerohedge_docs:/zerohedge_docs:ro
      - /root/zzLotteryTicket/output_rag:/app/output/rag
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: >
      python -u commands/rag_corpus_metadata/run_corpus_metadata_cmd.py
      RunCorpusMetadata mode=full source="/zerohedge_docs/Archives" dest_root="Archives"
    restart: unless-stopped
